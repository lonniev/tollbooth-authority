name: Tests

on:
  push:
    branches: [main, "feat/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Two flaws fixed here on 2026-08-23, both of which turned a clear
      # problem into a confusing one.
      #
      # It polled `pip index versions`, which reads the CDN-cached simple
      # index. That view lags: a version visible on PyPI's JSON API within
      # seconds of publish was still missing from pip's five minutes later.
      #
      # And on exhausting its attempts it fell through and exited SUCCESS,
      # letting the install fail seconds later with "no matching
      # distribution" and a 300-version list. A step whose only job is to
      # prevent that failure must not go quiet when it cannot.
      - name: Wait for tollbooth-dpyc on PyPI
        run: |
            set -euo pipefail
            REQUIRED=$(grep -oE 'tollbooth-dpyc(\[[a-z,]+\])?==[0-9.]+' pyproject.toml \
                       | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$REQUIRED" ]; then
              echo "No pinned tollbooth-dpyc version found; nothing to wait for."
              exit 0
            fi
            echo "Waiting for tollbooth-dpyc==$REQUIRED on PyPI..."
            for i in $(seq 1 30); do
              # The JSON API, not the cached simple index pip reads.
              if curl -sf "https://pypi.org/pypi/tollbooth-dpyc/$REQUIRED/json" \
                   -o /dev/null; then
                echo "Found tollbooth-dpyc==$REQUIRED on PyPI (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/30 — not yet available, waiting 10s..."
              sleep 10
            done
            echo "::error::tollbooth-dpyc==$REQUIRED never appeared on PyPI after 5 minutes."
            echo "The pin references a version that is not published. Check that the"
            echo "release workflow's PyPI publish succeeded before re-running this."
            exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q

      - name: Entrypoint inspects (the check Horizon performs at build time)
        run: |
          [ -f fastmcp.json ] || { echo "no fastmcp.json — not a FastMCP deployment; skipping"; exit 0; }
          ENTRY=$(python -c "import json;print(json.load(open('fastmcp.json'))['server'])")
          case "$ENTRY" in *:*) TARGET="$ENTRY";; *) TARGET="$ENTRY:mcp";; esac
          echo "inspecting $TARGET"
          if [ -f uv.lock ] && command -v uv >/dev/null 2>&1; then
            uv run fastmcp inspect -f fastmcp -o /tmp/server-info.json "$TARGET"
          else
            fastmcp inspect -f fastmcp -o /tmp/server-info.json "$TARGET"
          fi
